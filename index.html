<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Sisters Voice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf5ff;font-family:Arial;color:#111}
#exterior{min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;padding:20px}
.box{background:white;border-radius:26px;padding:24px;width:100%;max-width:360px;box-shadow:0 18px 40px rgba(147,51,234,0.12);border:1px solid #eee}
.hero{font-size:52px;font-weight:900;line-height:0.88;margin:0}.hero span{color:#9333ea}
#enterBtn{width:100%;margin-top:12px;background:#111;color:white;padding:15px;border-radius:999px;font-weight:900;border:0;cursor:pointer;font-size:14px}
#enterBtn:disabled{opacity:0.3}
#interior{display:none;max-width:1100px;margin:0 auto;padding:10px}
.card{background:white;border-radius:18px;padding:15px;margin-bottom:10px;border:1px solid #eee}
.dot{height:36px;width:36px;border-radius:50%;display:inline-block;margin:4px;cursor:pointer;border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,0.15)}
textarea{width:100%;background:#f5f3ff;border:1px solid #ede9fe;padding:13px;border-radius:12px;margin-bottom:8px;font-size:14px;outline:none}
.feed{background:white;border-radius:18px;border:1px solid #eee;overflow:hidden}
@media(max-width:700px){.layout{flex-direction:column!important}.side{max-width:100%!important}}
.inputName{width:100%;padding:14px;border-radius:14px;border:2px solid #e9d5ff;background:#fdfaff;font-size:14px;font-weight:700;outline:none;margin-bottom:10px;text-align:center}
.inputName:focus{border-color:#9333ea;background:white}
</style></head><body>

<div id="exterior"><div>
<h1 class="hero">Your Voice.<br><span>Your Hills.</span></h1>
<p style="color:#666;font-size:13px">Digital home for Northeast India</p>
<div class="box">
<p style="font-weight:900;margin:0 0 14px 0;font-size:14px" id="status">Enter your name to continue</p>
<input id="nameInput" class="inputName" placeholder="Your Name - e.g. Avin" oninput="checkName()">
<button id="enterBtn" disabled onclick="enterApp()">Enter Hills →</button>
<p style="font-size:11px;color:#666;margin-top:10px">No password needed - just your name</p>
</div>
</div></div>

<div id="interior">
<div class="layout" style="display:flex;gap:12px;align-items:flex-start">
<div class="side" style="width:100%;max-width:300px">
<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>👋 <span id="sideName">Avin</span></b><button onclick="logout()" style="background:#f3f4f6;border:0;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer">Logout</button></div>
<div class="card"><b style="font-size:13px">🎨 Theme</b><br><div style="margin-top:10px"><div class="dot" style="background:#9333ea" onclick="document.body.style.background='#fbf5ff'"></div><div class="dot" style="background:linear-gradient(45deg,red,orange)" onclick="document.body.style.background='#fff1f2'"></div><div class="dot" style="background:black" onclick="document.body.style.background='#111'"></div><div class="dot" style="background:white;border:3px solid black" onclick="document.body.style.background='white'"></div></div></div>
</div>
<div style="flex:1;min-width:280px" class="feed">
<div style="padding:14px;border-bottom:1px solid #eee"><b>Seven Sisters Voice</b><br><span style="color:#9333ea;font-size:12px;font-weight:800">Welcome <span id="topName">Avin</span>!</span></div>
<div style="padding:14px;background:#fdfaff;border-bottom:1px solid #eee">
<textarea id="postInput" placeholder="What's happening in hills today?" rows="3"></textarea>
<div id="preview" style="display:none;position:relative;margin-top:10px"><img id="previewImg" style="width:100%;border-radius:12px"><button onclick="removeImg()" style="position:absolute;top:8px;right:8px;background:red;color:white;border:0;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:900;cursor:pointer">✕</button></div>
<div style="display:flex;gap:8px;margin-top:12px"><label style="flex:1;background:#f3f4f6;text-align:center;padding:11px;border-radius:999px;font-size:12px;font-weight:800;cursor:pointer">📸 Photo<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="pickImg(this)"></label><button onclick="createPost()" style="flex:1;background:black;color:white;padding:11px;border-radius:999px;border:0;font-weight:900;cursor:pointer">Post</button></div>
</div>
<div id="posts"></div>
</div>
</div>
</div>

<script>
let currentUser=null, curImg='', posts=[{name:'Rohit • Jorhat',text:'Hello from Assam!',time:'Just now',img:''}];

function checkName(){
let v=document.getElementById('nameInput').value.trim();
let btn=document.getElementById('enterBtn');
let st=document.getElementById('status');
if(v.length>=2){btn.disabled=false; st.innerText='Welcome, '+v+'! Click Enter'; st.style.color='green';}
else{btn.disabled=true; st.innerText='Enter your name to continue'; st.style.color='black';}
}

function enterApp(){
let v=document.getElementById('nameInput').value.trim();
if(v.length<2){alert('Please enter your name (min 2 letters)');return;}
currentUser=v;
document.getElementById('sideName').innerText=currentUser;
document.getElementById('topName').innerText=currentUser;
document.getElementById('exterior').style.display='none';
document.getElementById('interior').style.display='block';
render();
}

function logout(){
document.getElementById('interior').style.display='none';
document.getElementById('exterior').style.display='flex';
document.getElementById('nameInput').value='';
document.getElementById('enterBtn').disabled=true;
document.getElementById('status').innerText='Enter your name to continue';
document.getElementById('status').style.color='black';
}

function pickImg(i){let r=new FileReader(); r.onload=e=>{curImg=e.target.result; document.getElementById('previewImg').src=curImg; document.getElementById('preview').style.display='block';}; r.readAsDataURL(i.files[0]);}
function removeImg(){curImg=''; document.getElementById('preview').style.display='none';}
function createPost(){let t=document.getElementById('postInput').value.trim(); if(!t&&!curImg){alert('Write something');return;} posts.unshift({name:currentUser+' • Assam',text:t,time:'Just now',img:curImg}); document.getElementById('postInput').value=''; curImg=''; removeImg(); render();}
function render(){document.getElementById('posts').innerHTML=posts.map(p=>`<div style="padding:14px;border-bottom:1px solid #eee"><b>${p.name}</b> • ${p.time}<div style="margin-top:8px">${p.text}</div>${p.img?`<img src="${p.img}" style="margin-top:10px;width:100%;border-radius:12px">`:''}</div>`).join('');}
</script>
</body></html>
