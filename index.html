<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Sisters Voice - Login Final</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Arial;transition:.3s} #authModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:100;justify-content:center;align-items:center;padding:20px}</style></head><body class="bg-[#fdf6ff]" id="mainBody">
<div class="bg-gradient-to-r from-red-600 via-yellow-400 to-red-600 text-white text-center py-2 text-xs font-black">🌾 BIHU FINAL WITH LOGIN 🌾</div>
<header class="bg-white p-3 border-b flex justify-between items-center sticky top-0 z-20"><div class="font-black">🎙️ Seven Sisters' <span class="text-pink-600">Voice</span></div><div class="flex items-center"><span id="userInfo" class="text-xs font-bold mr-2 hidden"></span><button id="loginBtn" class="px-3 py-1 border border-pink-600 text-pink-600 rounded-full text-xs font-bold mr-1" onclick="openAuth('login')">Log In</button><button id="signupBtn" class="px-3 py-1 bg-pink-600 text-white rounded-full text-xs font-bold mr-1" onclick="openAuth('signup')">Sign Up</button><button id="logoutBtn" class="px-3 py-1 border rounded-full text-xs hidden" onclick="logout()">Logout</button></div></header>

<div id="authModal" onclick="if(event.target==this)closeAuth()"><div class="bg-white p-6 rounded-2xl w-full max-w-[340px]"><h3 id="authTitle" class="font-black mb-3">Sign Up</h3><input id="authName" placeholder="Your Name" class="w-full p-3 bg-gray-100 rounded-xl mb-2 hidden"><input id="authEmail" placeholder="Email / Username" class="w-full p-3 bg-gray-100 rounded-xl mb-2"><input id="authPass" type="password" placeholder="Password" class="w-full p-3 bg-gray-100 rounded-xl mb-2"><button onclick="doAuth()" class="w-full bg-pink-600 text-white py-3 rounded-xl font-bold">Continue</button><p class="text-center text-xs mt-3"><span id="switchText">Already have account?</span> <a href="#" onclick="toggleAuthType();return false" id="switchLink" class="text-pink-600 font-bold">Log In</a></p><button onclick="closeAuth()" class="w-full bg-gray-100 py-2 rounded-xl text-xs mt-2">Cancel</button></div></div>

<div id="landing" class="min-h-[60vh] flex items-center justify-center p-6 text-center"><div><h1 class="text-[48px] font-black leading-none">Your Voice.<br><span class="text-purple-600">Your Hills.</span></h1><p class="text-xs text-gray-500 mt-2">Login yesterday was good - now fixed inside also!</p><button id="enterBtn" class="mt-6 bg-black text-white px-8 py-3 rounded-full font-bold">Enter Hills →</button></div></div>

<div id="app" class="hidden max-w-[1200px] mx-auto flex flex-col md:flex-row min-h-screen">
<div class="w-full md:w-[280px] p-3 space-y-3 bg-gray-50 border-r"><div class="bg-white p-4 rounded-2xl border"><p class="font-black text-sm">🎨 Change Theme</p><div class="grid grid-cols-4 gap-2 mt-2"><button onclick="changeTheme('purple')" class="h-8 w-8 rounded-full bg-purple-600 border-2 border-black"></button><button onclick="changeTheme('bihu')" class="h-8 w-8 rounded-full bg-red-600"></button><button onclick="changeTheme('dark')" class="h-8 w-8 rounded-full bg-black"></button><button onclick="changeTheme('light')" class="h-8 w-8 rounded-full bg-white border-2"></button></div></div><div class="bg-white p-4 rounded-2xl border"><p class="font-black text-sm">👤 Logged as</p><p id="leftUser" class="text-xs text-pink-600 font-bold mt-1">Not logged</p></div></div>
<div class="flex-1 bg-white"><div class="p-4 border-b"><p id="welcomeMsg" class="text-xs text-gray-500 mb-2">Please Log In to post</p><textarea id="postText" placeholder="Share Bihu vibe?" class="w-full p-3 bg-gray-100 rounded-xl text-sm outline-none" rows="2"></textarea><div id="preview" class="hidden mt-2 relative"><img id="previewImg" class="rounded-2xl max-h-60 w-full"><button onclick="removePreview()" class="absolute top-2 right-2 bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold">✕ Delete Photo</button></div><div class="flex justify-between mt-2"><label class="bg-gray-100 px-3 py-2 rounded-full text-xs font-bold cursor-pointer">📸 Photo<input type="file" id="imgInput" accept="image/*" class="hidden" onchange="handleImg(this)"></label><button onclick="createPost()" class="bg-black text-white px-6 py-2 rounded-full text-xs font-bold">Post</button></div></div><div id="posts"></div></div>
</div>

<script>
let currentUser=localStorage.getItem('ssv_user'), authType='signup', currentImg='', postsData=[{name:'Rohit - Jorhat',state:'Assam',text:'Happy Bihu! 🌾',likes:23,time:new Date(Date.now()-2*3600*1000),img:''}];
function timeAgo(d){if(typeof d==='string') return d; let s=Math.floor((new Date()-d)/1000); if(s<60) return "Just now"; let m=Math.floor(s/60); if(m<60) return m+" min ago"; let h=Math.floor(m/60); if(h<24) return h+" hr ago"; return Math.floor(h/24)+" day ago";}
function updateUI(){let logged=!!currentUser; document.getElementById('loginBtn').style.display=logged?'none':'inline-block'; document.getElementById('signupBtn').style.display=logged?'none':'inline-block'; document.getElementById('logoutBtn').style.display=logged?'inline-block':'none'; document.getElementById('userInfo').style.display=logged?'inline-block':'none'; if(logged){document.getElementById('userInfo').textContent=currentUser; document.getElementById('leftUser').textContent=currentUser; document.getElementById('welcomeMsg').textContent='Hi, '+currentUser+'! Share your voice 🎙️';}else{document.getElementById('leftUser').textContent='Not logged'; document.getElementById('welcomeMsg').textContent='Please Log In to post';}}
function openAuth(t){authType=t; document.getElementById('authModal').style.display='flex'; setAuthUI();}
function closeAuth(){document.getElementById('authModal').style.display='none';}
function setAuthUI(){document.getElementById('authTitle').textContent=authType=='signup'?'Sign Up':'Log In'; document.getElementById('authName').style.display=authType=='signup'?'block':'none'; document.getElementById('switchText').textContent=authType=='signup'?'Already have account?':'New here?'; document.getElementById('switchLink').textContent=authType=='signup'?'Log In':'Sign Up';}
function toggleAuthType(){authType=authType=='signup'?'login':'signup'; setAuthUI();}
function doAuth(){let name=document.getElementById('authName').value.trim(), email=document.getElementById('authEmail').value.trim(), pass=document.getElementById('authPass').value.trim(); if(!email||!pass){alert('Fill email/pass'); return;} if(authType=='signup'&&!name){alert('Enter name'); return;} let users=JSON.parse(localStorage.getItem('ssv_users')||'{}'); if(authType=='signup'){if(users[email]){alert('User exists, Log In'); authType='login'; setAuthUI(); return;} users[email]={name:name,pass:pass}; localStorage.setItem('ssv_users',JSON.stringify(users)); currentUser=name;}else{if(!users[email]||users[email].pass!=pass){alert('Wrong email/password'); return;} currentUser=users[email].name;} localStorage.setItem('ssv_user',currentUser); closeAuth(); updateUI();}
function logout(){localStorage.removeItem('ssv_user'); currentUser=null; updateUI();}
document.getElementById('enterBtn').addEventListener('click',()=>{document.getElementById('landing').style.display='none'; document.getElementById('app').classList.remove('hidden'); renderPosts(); setInterval(()=>renderPosts(),60000);});
function handleImg(i){let r=new FileReader(); r.onload=e=>{currentImg=e.target.result; document.getElementById('previewImg').src=currentImg; document.getElementById('preview').classList.remove('hidden');}; r.readAsDataURL(i.files[0]);}
function removePreview(){currentImg=''; document.getElementById('preview').classList.add('hidden'); document.getElementById('imgInput').value='';}
function createPost(){if(!currentUser){alert('Please Log In first'); openAuth('signup'); return;} let t=document.getElementById('postText').value.trim(); if(!t&&!currentImg) return; postsData.unshift({name:currentUser,state:'Assam',text:t,img:currentImg,likes:0,time:new Date()}); document.getElementById('postText').value=''; currentImg=''; removePreview(); renderPosts();}
function deletePost(i){if(confirm('Delete post?')){postsData.splice(i,1); renderPosts();}}
function renderPosts(){document.getElementById('posts').innerHTML=postsData.map((p,i)=>`<div class="p-4 border-b relative"><button onclick="deletePost(${i})" class="absolute top-2 right-2 bg-red-50 text-red-600 px-2 py-1 rounded-full text-[10px] font-bold">🗑️ Delete</button><b class="text-sm">${p.name}</b> <span class="text-[10px] bg-gray-100 px-2 py-1 rounded-full">⏰ ${timeAgo(p.time)}</span><p class="mt-2 text-sm">${p.text}</p>${p.img?`<img src="${p.img}" class="mt-2 rounded-2xl">`:''}</div>`).join('');}
function changeTheme(th){let b=document.getElementById('mainBody'); if(th==='purple') b.className='bg-[#fdf6ff]'; if(th==='bihu') b.className='bg-red-50'; if(th==='dark') b.className='bg-gray-900 text-white'; if(th==='light') b.className='bg-white';}
updateUI();
</script>
</body></html>
