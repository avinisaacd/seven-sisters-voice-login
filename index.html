*{box-sizing:border-box}body{margin:0;background:#fdf4ff;font-family:Arial,sans-serif;color:#111}
#exterior{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:#fdf4ff}
.hero{font-size:56px;font-weight:900;line-height:0.9;letter-spacing:-1.5px;margin:0}

.btn{width:100%;margin-top:14px;background:#111;color:white;padding:16px;border-radius:999px;font-weight:900;border:0;cursor:pointer;font-size:16px;transition:0.2s}
.btn:disabled{background:#bdbdbd;cursor:not-allowed;opacity:1}
.btn.enabled{background:#111}
#interior{display:none;max-width:1150px;margin:0 auto;padding:12px}
.card{background:white;border-radius:16px;padding:14px;border:1px solid #eee;margin-bottom:10px}
.tab{padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;margin-bottom:6px;background:#f5f5f5;display:flex;justify-content:space-between}
.tab.active{background:#111;color:white}
.feed{background:white;border-radius:18px;border:1px solid #eee;min-height:600px;overflow:hidden}
.job{background:#fdfaff;border:1px solid #f3e8ff;border-radius:14px;padding:14px;margin-bottom:10px}
@media(max-width:800px){.layout{flex-direction:column!important}.side{max-width:100%!important}}
