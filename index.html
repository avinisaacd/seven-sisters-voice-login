<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Sisters Voice</title>
<style>body{margin:0;background:#fdf4ff;font-family:Arial;text-align:center}h1{font-size:52px;font-weight:900;line-height:.9;padding-top:80px}h1 span{color:#9333ff;display:block}.box{background:#fff;border-radius:28px;padding:24px;width:90%;max-width:360px;margin:30px auto;box-shadow:0 20px 40px rgba(0,0,0,.1)}input{width:100%;padding:16px;border-radius:16px;border:2px solid #e9d5ff;text-align:center;font-weight:800}button{width:100%;margin-top:14px;background:#111;color:#fff;padding:16px;border-radius:999px;font-weight:900;border:0;font-size:16px;cursor:pointer}#main{display:none;text-align:left;max-width:900px;margin:0 auto;padding:14px}.card{background:#fff;border-radius:16px;padding:14px;border:1px solid #eee;margin-bottom:10px}</style></head><body>
