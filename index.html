<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Sisters Voice</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6">
<div id="landing" class="text-center max-w-2xl w-full">
<h1 class="text-6xl font-extrabold leading-tight">Your Voice.<br><span class="bg-gradient-to-r from-purple-600 via-pink-500 to-cyan-500 bg-clip-text text-transparent">Your Hills.</span></h1>
<p class="text-gray-500 text-xl mt-6 mb-10">Seven Sisters Voice - Northeast Youth</p>
<div class="flex flex-col sm:flex-row gap-4 justify-center">
<button onclick="openJoin()" class="bg-black text-white px-10 py-4 rounded-full text-xl font-bold">Join the Hills</button>
<button onclick="openLogin()" class="bg-white border-2 border-gray-200 px-10 py-4 rounded-full text-xl font-bold">Log In</button>
</div>
</div>

<div id="joinBox" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
<div class="bg-white rounded-3xl p-8 w-full max-w-md">
<h2 class="text-3xl font-bold mb-6">Join the Hills</h2>
<input id="jName" placeholder="Full Name" class="w-full border p-3 rounded-xl mb-3">
<input id="jEmail" placeholder="Email" class="w-full border p-3 rounded-xl mb-3">
<input id="jState" class="w-full border p-3 rounded-xl mb-4">
<option>Assam</option><option>Meghalaya</option><option>Manipur</option><option>Nagaland</option><option>Mizoram</option><option>Tripura</option><option>Arunachal Pradesh</option>
</select>
<button onclick="doJoin()" class="w-full bg-black text-white py-3 rounded-xl font-bold">Create & Enter</button>
<button onclick="closeAll()" class="w-full mt-3 text-gray-500">Cancel</button>
</div>
</div>

<div id="loginBox" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
<div class="bg-white rounded-3xl p-8 w-full max-w-md">
<h2 class="text-3xl font-bold mb-6">Welcome Back</h2>
<input id="lEmail" placeholder="Email" class="w-full border p-3 rounded-xl mb-4">
<button onclick="doLogin()" class="w-full bg-black text-white py-3 rounded-xl font-bold">Log In</button>
<button onclick="closeAll()" class="w-full mt-3 text-gray-500">Cancel</button>
</div>
</div>

<div id="feed" class="hidden w-full max-w-2xl">
<div class="bg-white rounded-3xl p-6 shadow mb-6">
<h2 class="font-bold text-xl">Hello, <span id="uName"></span> 🏔️</h2>
<button onclick="logout()" class="mt-3 text-sm bg-gray-100 px-4 py-2 rounded-full">Logout</button>
</div>
<div class="bg-white rounded-3xl p-6 shadow mb-6">
<textarea id="postText" placeholder="What's happening in hills?" class="w-full border rounded-xl p-3" rows="3"></textarea>
<button onclick="createPost()" class="mt-3 bg-black text-white px-6 py-2 rounded-full">Post</button>
</div>
<div id="posts"></div>
</div>

<script>
function openJoin(){document.getElementById('joinBox').classList.remove('hidden')}
function openLogin(){document.getElementById('loginBox').classList.remove('hidden')}
function closeAll(){document.getElementById('joinBox').classList.add('hidden');document.getElementById('loginBox').classList.add('hidden')}
function doJoin(){
var n=document.getElementById('jName').value;
if(!n){alert('Enter name');return}
localStorage.setItem('ssv_name',n);
localStorage.setItem('ssv_email',document.getElementById('jEmail').value);
showFeed();
}
function doLogin(){
var e=document.getElementById('lEmail').value;
if(!e){alert('Enter email');return}
if(!localStorage.getItem('ssv_name')) localStorage.setItem('ssv_name',e.split('@')[0]);
localStorage.setItem('ssv_email',e);
showFeed();
}
function showFeed(){
document.getElementById('landing').classList.add('hidden');
closeAll();
document.getElementById('feed').classList.remove('hidden');
document.getElementById('uName').innerText=localStorage.getItem('ssv_name');
loadPosts();
}
function logout(){localStorage.clear();location.reload()}
function createPost(){
var t=document.getElementById('postText').value;
if(!t)return;
var p=JSON.parse(localStorage.getItem('ssv_posts')||'[]');
p.unshift({name:localStorage.getItem('ssv_name'),text:t,time:new Date().toLocaleString()});
localStorage.setItem('ssv_posts',JSON.stringify(p));
document.getElementById('postText').value='';
loadPosts();
}
function loadPosts(){
var p=JSON.parse(localStorage.getItem('ssv_posts')||'[]');
var c=document.getElementById('posts');
if(p.length==0){c.innerHTML='<div class=text-center text-gray-400 py-10>No posts yet</div>';return}
c.innerHTML=p.map(function(x){return '<div class="bg-white rounded-3xl p-6 shadow mb-4"><b>'+x.name+'</b> <span class=text-xs text-gray-400>'+x.time+'</span><p class=mt-3>'+x.text+'</p></div>'}).join('');
}
if(localStorage.getItem('ssv_email')){showFeed()}
</script>
</body>
</html>
