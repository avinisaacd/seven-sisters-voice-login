<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Sisters Voice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI}
body{background:#F6F1E8; min-height:100vh}
.exterior{
background: radial-gradient(120% 120% at 70% 30%, #8B1A4A 0%, #4A1942 25%, #1A0F1F 60%, #0D0D0D 100%);
color:white; padding:28px 20px 40px; position:relative; overflow:hidden
}
.exterior::before{
content:""; position:absolute; top:-40px; left:-20px; right:-20px; height:300px;
background: radial-gradient(60% 80% at 30% 20%, rgba(255,120,80,.25), transparent);
filter:blur(20px)
}
.top-small{display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; position:relative}
.dot{width:10px;height:10px;background:white;border-radius:50%; display:inline-block; animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.4}}
.sub{font-size:10px; letter-spacing:2.5px; opacity:.6; margin-top:4px; margin-left:18px}
.big{font-size:48px; font-weight:900; line-height:.9; margin-top:36px; letter-spacing:-1px; position:relative}
.big .hills{
background: linear-gradient(90deg, #FF8C42, #FFB07C, #8B8CFF);
-webkit-background-clip:text; -webkit-text-fill-color:transparent;
background-clip:text;
}
.desc{margin-top:20px; opacity:.7; font-size:13px; line-height:1.5}
.pills{display:flex; gap:8px; margin-top:22px; flex-wrap:wrap; position:relative}
.pill{padding:8px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.08); font-size:12px; font-weight:600; backdrop-filter:blur(8px)}

.card{
background:white; border-radius:24px 24px 0 0; margin-top:-18px; padding:28px 22px 40px;
position:relative; box-shadow:0 -10px 40px rgba(0,0,0,.15); min-height:60vh
}
.label{font-size:11px; font-weight:800; letter-spacing:1.5px; opacity:.8; margin-bottom:10px; display:block}
.input{
width:100%; padding:16px; border-radius:14px; border:1.5px solid #EDE6D9; background:#FFFEFB;
font-size:15px; outline:none; transition:.2s
}
.input:focus{border-color:#8B1A4A; background:white}
.btn{width:100%; padding:16px; border-radius:14px; border:none; background:#1A1A1A; color:white; font-weight:800; font-size:15px; margin-top:18px; cursor:pointer}
.small{font-size:12px; text-align:center; margin-top:14px; opacity:.6}
</style>
</head>
<body>

<div class="exterior">
  <div class="top-small"><span class="dot"></span> Seven Sisters Voice</div>
  <div class="sub">NORTHEAST INDIA • EST 2026</div>

  <div class="big">Your<br>Voice.<br>Your<br><span class="hills">Hills.</span></div>

  <div class="desc">Assam • Meghalaya • Nagaland • Manipur • Mizoram<br>• Tripura • Arunachal — Built for us.</div>

  <div class="pills">
    <div class="pill">⛰️ 7 Sisters</div>
    <div class="pill">🎞️ Stories</div>
    <div class="pill">💬 Chat</div>
  </div>
</div>

<div class="card">
  <h2 style="font-size:28px; font-weight:800; letter-spacing:-.5px">Welcome back</h2>
  <p style="opacity:.5; font-size:14px; margin-top:6px">Log in to Seven Sisters Voice</p>

  <div style="margin-top:28px">
    <span class="label">EMAIL</span>
    <input class="input" placeholder="admin@test.com" value="admin@test.com">
  </div>

  <div style="margin-top:18px">
    <span class="label">PASSWORD</span>
    <input class="input" type="password" placeholder="••••••••" value="password">
  </div>

  <button class="btn" onclick="alert('Logged in! Interior feed coming next')">Log in →</button>
  <div class="small">Interior • Exterior • Eye-friendly theme inside</div>
</div>

</body>
</html>
