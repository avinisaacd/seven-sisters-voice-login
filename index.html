<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Sisters Voice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0e0e12;color:#fff;overflow-x:hidden}
a{color:#a78bfa;text-decoration:none}
.exterior{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:radial-gradient(800px 400px at 50% -10%,#2a1f4a 0%,#0e0e12 60%)}
.exterior h1{font-size:clamp(32px,6vw,64px);font-weight:800;letter-spacing:-1px}
.exterior p{color:#a1a1b5;margin:16px 0 30px;max-width:520px;font-size:18px}
.btn{padding:14px 28px;border-radius:999px;border:none;font-weight:700;cursor:pointer;transition:.2s}
.btn-primary{background:#fff;color:#000}
.btn-primary:hover{transform:scale(1.03)}
.btn-ghost{background:#1e1e26;color:#fff;margin-left:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.active{display:flex}
.card{width:100%;max-width:420px;background:#18181f;border:1px solid #2a2a36;border-radius:24px;padding:28px}
.card h2{font-size:28px;margin-bottom:8px}
.card small{color:#8b8b9e}
.input{width:100%;background:#101018;border:1px solid #2a2a36;border-radius:12px;padding:14px;margin-top:12px;color:#fff;outline:none}
.input:focus{border-color:#7c5cff}
.btn-full{width:100%;margin-top:16px;background:#7c5cff;color:#fff;padding:14px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.link{color:#a78bfa;font-size:14px;cursor:pointer;margin-top:12px;display:inline-block}
.app{display:none;min-height:100vh;background:#0e0e12}
.app.active{display:block}
.topbar{position:sticky;top:0;z-index:10;background:#0e0e12cc;backdrop-filter:blur(12px);border-bottom:1px solid #1f1f2b;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.profile-wrap{max-width:700px;margin:0 auto;padding:16px}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#2a2a36;border:3px solid #7c5cff;cursor:pointer}
.stories{display:flex;gap:14px;overflow-x:auto;padding:16px 0;border-bottom:1px solid #1f1f2b;scrollbar-width:none}
.story{flex:0 0 68px;text-align:center;cursor:pointer}
.story img{width:68px;height:68px;border-radius:50%;border:2px solid #7c5cff;object-fit:cover;background:#222}
.create{background:#18181f;border-radius:16px;padding:14px;margin:16px 0;border:1px solid #222230}
.post{background:#18181f;border-radius:16px;margin:16px 0;overflow:hidden;border:1px solid #222230}
.post img, .post video{width:100%;max-height:500px;object-fit:cover;display:block}
.post-body{padding:14px}
.tabs{display:flex;gap:8px;margin-top:20px}
.tab{padding:8px 16px;border-radius:999px;background:#1e1e26;border:1px solid #2a2a36;cursor:pointer}
.tab.active{background:#fff;color:#000}
.hidden{display:none}
</style>
</head>
<body>

<!-- EXTERIOR - FIXED SINGLE DISPLAY -->
<div id="exterior" class="exterior">
  <h1>Your Voice.<br>Your Hills.</h1>
  <p>The first social voice for the Seven Sisters. Share stories, songs & truth from Northeast India.</p>
  <div>
    <button class="btn btn-primary" onclick="openModal('signup')">Join the Hills</button>
    <button class="btn btn-ghost" onclick="openModal('login')">Log In</button>
  </div>
</div
