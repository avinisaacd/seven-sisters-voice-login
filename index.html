<title>Seven Sisters Voice - Colourful</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0a0a0f;color:#fff;overflow-x:hidden}
.exterior{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative;overflow:hidden}
/* 7 sisters colour glow */
.exterior::before{content:'';position:absolute;width:1200px;height:600px;top:-100px;left:50%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(124,92,255,.35) 0%,rgba(255,107,107,.2) 25%,rgba(78,205,196,.15) 50%,rgba(255,230,109,.1) 75%,transparent 70%);filter:blur(20px);pointer-events:none}
.hills{font-size:clamp(36px,7vw,72px);font-weight:900;letter-spacing:-2px;line-height:0.95;position:relative;z-index:1}
.hills span.white{color:#fff;display:block}
.hills span.gradient{background:linear-gradient(90deg,#7c5cff,#ff6b9d,#feca57,#48dbfb,#1dd1a1,#ff9ff3,#f368e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block;animation:shift 8s linear infinite;background-size:200% 100%}
@keyframes shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.seven-dots{display:flex;gap:8px;margin:20px 0;z-index:1}
.dot{width:10px;height:10px;border-radius:50%}
