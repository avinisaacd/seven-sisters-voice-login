<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title>
<style>body{font-family:Arial;padding:20px;background:#f5f5f5}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px} button{padding:8px 12px;border:none;border-radius:8px;cursor:pointer}.verify{background:#0a7d20;color:#fff}.delete{background:#d00;color:#fff} input{padding:12px;width:100%;margin:10px 0;border-radius:8px;border:1px solid #ddd}</style>
</head>
<body>
<div id="login"><div class="card"><h2>Admin Login</h2><input id="pass" type="password" placeholder="Password"><button onclick="login()" style="background:#ff6b35;color:#fff;width:100%;padding:12px;border-radius:25px">Login</button><p style="font-size:12px;color:#888">Default password: 1234 - change in code later</p></div></div>
<div id="panel" style="display:none">
<h2>Admin Panel - Verify Jobs</h2>
<div id="list"></div>
<button onclick="clearAll()" style="background:#000;color:#fff;margin-top:20px">Clear All Jobs (Reset)</button>
</div>
<script>
function login(){ if(document.getElementById('pass').value=='1234'){ document.getElementById('login').style.display='none'; document.getElementById('panel').style.display='block'; load(); } else alert('Wrong password'); }
function load(){
 let h=JSON.parse(localStorage.getItem('hireJobs')||'[]');
 let div=document.getElementById('list');
 div.innerHTML='';
 if(!h.length) div.innerHTML='<div class="card">No jobs</div>';
 h.forEach(j=>{
  div.innerHTML+=`<div class="card"><b>${j.role}</b> at ${j.company}<br>${j.loc}<br>${j.details}<br>📞 ${j.phone}<br>Reports: ${j.reports||0} | ${j.verified?'✅ Verified':'⏳ Pending'}<br><br><button class="verify" onclick="verify(${j.id})">✅ Verify</button> <button class="delete" onclick="del(${j.id})">Delete</button></div>`;
 });
}
function verify(id){ let jobs=JSON.parse(localStorage.getItem('hireJobs')||'[]'); let j=jobs.find(x=>x.id==id); if(j){j.verified=true; localStorage.setItem('hireJobs',JSON.stringify(jobs)); load(); alert('Verified!'); } }
function del(id){ if(!confirm('Delete?'))return; let jobs=JSON.parse(localStorage.getItem('hireJobs')||'[]'); jobs=jobs.filter(x=>x.id!=id); localStorage.setItem('hireJobs',JSON.stringify(jobs)); load(); }
function clearAll(){ if(confirm('Delete all jobs?')){ localStorage.removeItem('hireJobs'); localStorage.removeItem('needJobs'); load(); } }
</script>
</body>
</html>
