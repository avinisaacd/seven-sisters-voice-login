*{box-sizing:border-box}body{margin:0;background:#fbf5ff;font-family:Arial;color:#111}
#exterior{min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;padding:20px}
.box{background:white;border-radius:26px;padding:24px;width:100%;max-width:360px;box-shadow:0 18px 40px rgba(147,51,234,0.12);border:1px solid #eee}

.card{background:white;border-radius:18px;padding:15px;margin-bottom:10px;border:1px solid #eee}

.feed{background:white;border-radius:18px;border:1px solid #eee;overflow:hidden}
@media(max-width:700px){.layout{flex-direction:column!important}.side{max-width:100%!important}}

</div>
