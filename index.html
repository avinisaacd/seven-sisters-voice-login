<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Sisters Voice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf5ff;font-family:Arial}
#exterior{min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;padding:20px}
.box{background:white;border-radius:20px;padding:24px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,0.1);border:1px solid #eee}
.hero{font-size:48px;font-weight:900;line-height:0.9;margin:0}.hero span{color:#9333ea}
#enterBtn{width:100%;margin-top:12px;background:#111;color:white;padding:15px;border-radius:999px;font-weight:900;border:0;cursor:pointer;font-size:15px}
#enterBtn:disabled{opacity:0.3}
#interior{display:none;max-width:1100px;margin:0 auto;padding:10px}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid #eee}
.tab{padding:12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;margin-bottom:6px;background:#f9f9f9}
.tab.active{background:#111;color:white}
.feed{background:white;border-radius:16px;border:1px solid #eee;min-height:500px;overflow:hidden}
.inputName{width:100%;padding:14px;border-radius:12px;border:2px solid #e9d5ff;background:#fdfaff;font-weight:700;text-align:center;font-size:15px}
.job{background:#fdfaff;border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:10px}
</style></head><body>

<div id="exterior"><div>
<h1 class="hero">Your Voice.<br><span>Your Hills.</span></h1>
<p style="color:#666;font-size:13px">Northeast India</p>
