<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Sisters Voice</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0a0a0f;color:#fff}.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(800px 400px at 50% 0%,#2a1f4a 0%,#0a0a0f 60%)}h1{font-size:52px;font-weight:900;line-height:.95}.grad{background:linear-gradient(90deg,#7c5cff,#ff6b9d,#feca57,#48dbfb,#1dd1a1,#ff9ff3,#5f27cd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.dots{display:flex;gap:7px;justify-content:center;margin:18px 0}.dot{width:11px;height:11px;border-radius:50%}.sub{color:#9aa;margin:12px auto 24px;max-width:480px}.btn{padding:14px 28px;border-radius:99px;border:none;font-weight:800;cursor:pointer;font-size:16px}.b1{background:#fff;color:#000}.b2{background:#222;color:#fff;border:1px solid #444;margin-left:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:999}.box{background:#1a1a24;border:1px solid #333;border-radius:20px;padding:24px;width:100%;max-width:380px}.box input,.box textarea{width:100%;padding:12px;border-radius:10px;background:#0f0f14;border:1px solid #333;color:#fff;margin-top:10px}.btnF{width:100%;padding:13px;background:#7c5cff;color:#fff;border:none;border-radius:10px;margin-top:14px;font-weight:700;cursor:pointer}#app{display:none;max-width:700px;margin:0 auto;padding:16px}.card{background:#1a1a24;border:1px solid #2a2a3a;border-radius:14px;padding:14px;margin:14px 0}.avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#333;border:2px solid #7c5cff}.post{background:#1a1a24;border:1px solid #2a2a3a;border-radius:14px;overflow:hidden;margin:14px 0}.post img,.post video{width:100%;display:block}.post-body{padding:12px}</style></head><body>
<div id="hero" class="hero"><div><h1>Your Voice.<br><span class="grad">Your Hills.</span></h1><div class="dots"><div class="dot" style="background:#ff6b6b"></div><div class="dot" style="background:#feca57"></div><div class="dot" style="background:#48dbfb"></div><div class="dot" style="background:#1dd1a1"></div><div class="dot" style="background:#ff9ff3"></div><div class="dot" style="background:#5f27cd"></div><div class="dot" style="background:#00d2d3"></div></div><p class="sub">The first social voice for Seven Sisters. Share stories, songs & truth from Northeast.</p><button class="btn b1" onclick="document.getElementById('su').style.display='flex'">Join the Hills</button><button class="btn b2" onclick="document.getElementById('li').style.display='flex'">Log In</button></div></div>
<div id="su" class="modal"><div class="box"><h2>Join the Hills</h2><input id="sn" placeholder="Full Name"><input id="sd" type="date"><input id="se" placeholder="Email"><input id="sp" type="password" placeholder="Password"><button class="btnF" onclick="signup()">Sign Up & Enter</button><p style="margin-top:12px;font-size:13px;color:#a78bfa;cursor:pointer" onclick="hideAll();document.getElementById('li').style.display='flex'">Already have account? Login</p><p onclick="hideAll()" style="margin-top:8px;font-size:13px;cursor:pointer;color:#777">Close</p></div></div>
<div id="li" class="modal"><div class="box"><h2>Welcome Back</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button class="btnF" onclick="login()">Login</button><p style="margin-top:12px;font-size:13px;color:#a78bfa;cursor:pointer" onclick="hideAll();document.getElementById('su').style.display='flex'">New? Sign up</p><p onclick="hideAll()" style="margin-top:8px;font-size:13px;cursor:pointer;color:#777">Close</p></div></div>
<div id="app"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #222"><b>Seven Sisters Voice</b><button onclick="logout()" style="background:#222;color:#fff;border:none;padding:6px 14px;border-radius:99px;cursor:pointer">Logout</button></div><div class="card" style="display:flex;gap:14px;align-items:center"><img id="pp" class="avatar" src="https://i.pravatar.cc/100"><div style="flex:1"><input id="en" placeholder="Name"><input id="ed" type="date" style="margin-top:6px"><input id="eb" placeholder="Bio" style="margin-top:6px"><input type="file" id="pf" accept="image/*" style="margin-top:8px" onchange="picChange(this)"></div></div><button class="btnF" onclick="saveProfile()">Save Profile (Name + DOB + Photo)</button><div class="card"><textarea id="pt" placeholder="What's in your hills today?" style="width:100%;background:#0f0f14;border:1px solid #333;border-radius:10px;color:#fff;padding:10px;min-height:70px"></textarea><input type="file" id="mf" accept="image/*,video/*" hidden onchange="mediaChange(this)"><div style="display:flex;gap:10px;margin-top:10px"><button onclick="document.getElementById('mf').click()" style="background:#222;color:#fff;border:1px solid #333;padding:7px 14px;border-radius:99px;cursor:pointer">📷 Photo / Video</button><span id="mn" style="font-size:12px;color:#888"></span></div><img id="mp" style="width:100%;border-radius:10px;margin-top:10px;display:none"><video id="vp" style="width:100%;border-radius:10px;margin-top:10px;display:none" controls></video><button class="btnF" onclick="post()">Post to Hills</button></div><div id="feed"></div></div>
