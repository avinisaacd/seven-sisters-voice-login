<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Sisters Voice | Your Voice. Your Hills.</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}body{background:#fcfcff;color:#12131a}.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(800px 400px at 50% -10%,#ede8ff 0%,#fcfcff 60%)}h1{font-size:clamp(44px,8vw,72px);font-weight:900;line-height:.9;letter-spacing:-.04em}.grad{background:linear-gradient(90deg,#7c5cff,#ff3b9a,#ff8a00,#00c6ff,#00d68f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.dots{display:flex;gap:10px;justify-content:center;margin:20px 0}.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.15)}.sub{color:#6b7280;max-width:520px;margin:0 auto 30px;font-size:18px;line-height:1.5}.btn{padding:14px 28px;border-radius:99px;border:none;font-weight:800;cursor:pointer;font-size:16px;transition:.2s}.b1{background:#12131a;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.15)}.b1:hover{transform:translateY(-2px)}.b2{background:#fff;color:#12131a;border:2px solid #e5e7eb;margin-left:10px}.modal{position:fixed;inset:0;background:rgba(12,13,20,.55);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}.box{background:#fff;border-radius:24px;padding:28px;width:100%;max-width:410px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.box h2{font-size:22px}.box input,.box textarea{width:100%;padding:13px 14px;border-radius:12px;border:2px solid #eef0f5;margin-top:12px;font-size:15px;outline:none}.box input:focus{border-color:#7c5cff}.btnF{width:100%;padding:14px;background:#12131a;color:#fff;border:none;border-radius:12px;margin-top:18px;font-weight:800;cursor:pointer} #app{display:none;max-width:720px;margin:0 auto;padding:0 16px 80px}.top{position:sticky;top:0;z-index:10;background:rgba(252,252,255,.9);backdrop-filter:blur(14px);display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin:0 -16px;border-bottom:1px solid #eef0f5}.card{background:#fff;border:1px solid #eef0f5;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 4px 20px rgba(0,0,0,.03)}.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #7c5cff;background:#eee}.post{background:#fff;border:1px solid #eef0f5;border-radius:20px;overflow:hidden;margin:16px 0}.post img.main,.post video.main{width:100%;display:block}.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:#f3f0ff;color:#7c5cff}</style></head><body>
<div id="hero" class="hero"><div><h1>Your Voice.<br><span class="grad">Your Hills.</span></h1><div class="dots"><div class="dot" style="background:#ff5a5a"></div><div class="dot" style="background:#ffbe0b"></div><div class="dot" style="background:#3ae0ff"></div><div class="dot" style="background:#1dd1a1"></div><div class="dot" style="background:#ff9ff3"></div><div class="dot" style="background:#7c5cff"></div><div class="dot" style="background:#00d2d3"></div></div><p class="sub">The first social voice for Seven Sisters. Share stories, songs, culture & truth from Arunachal to Tripura. Built for the youth.</p><div><button class="btn b1" onclick="su.style.display='flex'">Join the Hills</button><button class="btn b2" onclick="li.style.display='flex'">Log In</button></div><p style="margin-top:24px;color:#a78bfa;font-size:12px;letter-spacing:2px;font-weight:800">SEVEN SISTERS VOICE • EST 2026</p></div></div>
<div id="su" class="modal"><div class="box"><h2>Join the Hills 🏔️</h2><p style="color:#888;font-size:13px;margin-top:4px">Your Northeast identity</p><input id="sn" placeholder="Full Name *"><input id="sd" type="date"><input id="se" type="email" placeholder="Email *"><input id="sp" type="password" placeholder="Password *"><button class="btnF" onclick="signup()">Sign Up & Enter Hills</button><p onclick="su.style.display='none'" style="text-align:center;color:#999;margin-top:12px;cursor:pointer;font-size:13px">Close</p></div></div>
<div id="li" class="modal"><div class="box"><h2>Welcome Back</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button class="btnF" onclick="login()">Login</button><p onclick="li.style.display='none'" style="text-align:center;color:#999;margin-top:12px;cursor:pointer;font-size:13px">Close</p></div></div>
<div id="app"><div class="top"><b style="letter-spacing:-.02em">SEVEN SISTERS VOICE</b><button onclick="logout()" style="padding:7px 16px;border-radius:99px;border:1px solid #e5e7eb;background:#fff;cursor:pointer">Logout</button></div><div class="card" style="display:flex;gap:16px"><img id="pp" class="avatar" src="https://i.pravatar.cc/200"><div style="flex:1"><input id="en" placeholder="Your Name" style="width:100%;padding:11px;border-radius:12px;border:2px solid #eef0f5"><input id="ed" type="date" style="width:100%;padding:11px;border-radius:12px;border:2px solid #eef0f5;margin-top:8px"><input id="eb" placeholder="Bio - Which State? e.g. Assam Proud" style="width:100%;padding:11px;border-radius:12px;border:2px solid #eef0f5;margin-top:8px"><input type="file" id="pf" accept="image/*" hidden onchange="onPic(this)"><button onclick="pf.click()" style="margin-top:10px;padding:8px 16px;border-radius:99px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-size:13px">📷 Change Photo</button></div></div><button class="btnF" style="background:#7c5cff" onclick="saveP()">Save Profile</button><div class="card"><textarea id="pt" placeholder="What's happening in your hills today?..." style="width:100%;min-height:80px;padding:12px;border-radius:12px;border:2px solid #eef0f5;resize:none;outline:none"></textarea><input type="file" id="mf" accept="image/*,video/*" hidden onchange="onMedia(this)"><div style="display:flex;gap:8px;margin-top:10px;align-items:center"><button onclick="mf.click()" style="padding:9px 18px;border-radius:99px;border:1px solid #e5e7eb;background:#f8f7ff;cursor:pointer;font-weight:700">📷 Photo / 🎥 Video</button><span id="mn" style="font-size:12px;color:#999"></span></div><img id="mp" style="width:100%;border-radius:14px;margin-top:12px;display:none"><video id="vp" style="width:100%;border-radius:14px;margin-top:12px;display:none" controls></video><button class="btnF" onclick="doPost()">Post to Hills ↗️</button></div><div id="feed"></div></div>
<script>
let cur=JSON.parse(localStorage.getItem('ssv_user')||'null');
let posts=JSON.parse(localStorage.getItem('ssv_posts')||'[]');
let tmp=null,tt=null;
function signup(){let n=sn.value.trim(),d=sd.value,e=se.value.trim(),p=sp.value;if(!n||!e||!p){alert('Fill Name Email Pass');return}let u={name:n,dob:d,email:e,pass:p,pic:'https://i.pravatar.cc/200?u='+Date.now(),bio:''};let all=JSON.parse(localStorage.getItem('ssv_users')||'[]');if(all.find(x=>x.email==e)){alert('Already exists, Login');su.style.display='none';li.style.display='flex';return}all.push(u);localStorage.setItem('ssv_users',JSON.stringify(all));localStorage.setItem('ssv_user',JSON.stringify(u));location.reload();}
function login(){let all=JSON.parse(localStorage.getItem('ssv_users')||'[]');let f=all.find(x=>x.email==le.value.trim()&&x.pass==lp.value);if(!f){alert('Wrong login');return}localStorage.setItem('ssv_user',JSON.stringify(f));location.reload();}
function logout(){localStorage.removeItem('ssv_user');location.reload();}
function onPic(i){let r=new FileReader();r.onload=e=>pp.src=e.target.result;r.readAsDataURL(i.files[0]);}
function saveP(){cur.name=en.value;cur.dob=ed.value;cur.bio=eb.value;cur.pic=pp.src;localStorage.setItem('ssv_user',JSON.stringify(cur));let all=JSON.parse(localStorage.getItem('ssv_users')||'[]').map(u=>u.email==cur.email?cur:u);localStorage.setItem('ssv_users',JSON.stringify(all));alert('Profile Saved ✅');}
function onMedia(i){let f=i.files[0];if(!f)return;tt=f.type.startsWith('video')?'v':'i';let r=new FileReader();r.onload=e=>{tmp=e.target.result;if(tt=='i'){mp.src=tmp;mp.style.display='block';vp.style.display='none'}else{vp.src=tmp;vp.style.display='block';mp.style.display='none'}mn.textContent=f.name};r.readAsDataURL(f);}
function doPost(){let t=pt.value;if(!t&&!tmp){alert('Write something');return}let p={name:cur.name,pic:cur.pic,bio:cur.bio||'Seven Sisters',text:t,media:tmp,type:tt,time:new Date().toLocaleString()};posts.unshift(p);localStorage.setItem('ssv_posts',JSON.stringify(posts));pt.value='';tmp=null;mp.style.display='none';vp.style.display='none';mn.textContent='';render();}
function render(){feed.innerHTML=posts.map(p=>`<div class="post"><div style="padding:14px;display:flex;gap:10px;align-items:center"><img src="${p.pic}" style="width:36px;height:36px;border-radius:50%;object-fit:cover"><div><div style="font-weight:800;display:flex;gap:6px;align-items:center">${p.name} <span class="badge">${p.bio||'Northeast'}</span></div><div style="font-size:11px;color:#999">${p.time}</div></div></div>${p.text?`<div style="padding:0 14px 14px">${p.text}</div>`:''}${p.media? (p.type=='i'?`<img class="main" src="${p.media}">`:`<video class="main" src="${p.media}" controls>`):''}<div style="padding:10px 14px;display:flex;gap:16px;color:#999;font-size:13px;font-weight:600"><span>❤️ Like</span><span>💬 Comment</span><span>↗️ Share</span></div></div>`).join('')||'<p style="text-align:center;color:#bbb;margin:40px">No posts yet. Be the first voice!</p>'}
if(cur){hero.style.display='none';app.style.display='block';pp.src=cur.pic;en.value=cur.name;ed.value=cur.dob||'';eb.value=cur.bio||'';render();}
</script></body></html>
