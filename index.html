<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0f;color:#fff}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(600px 300px at 50% 0%,#2a1f4a,#0a0a0f)}

.dot{width:10px;height:10px;border-radius:50%}

.box{background:#18181f;border-radius:20px;padding:24px;width:100%;max-width:400px;border:1px solid #333}
input{width:100%;padding:12px;border-radius:10px;background:#101018;border:1px solid #333;color:#fff;margin-top:10px}
.btnFull{width:100%;padding:12px;background:#7c5cff;color:#fff;border:none;border-radius:10px;margin-top:12px;font-weight:700;cursor:pointer}
#app{display:none;padding:20px;max-width:700px;margin:0 auto}
.post{background:#18181f;border:1px solid #222;border-radius:14px;padding:12px;margin:12px 0}
</style>
</head>
