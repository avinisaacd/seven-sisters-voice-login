<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Sisters Voice - Northeast Youth</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6">

<!-- MAIN SCREEN - From your screenshot -->
<div id="landing" class="text-center max-w-2xl w-full">
<h1 class="text-6xl md:text-7xl font-extrabold leading-tight">
Your Voice.<br>
<span class="bg-gradient-to-r from-purple-600 via-pink-500 via-orange-500 to-cyan-500 bg-clip-text text-transparent">Your Hills.</span>
</h1>
<p class="text-gray-500 text-xl mt-6 mb-10">Seven Sisters Voice - Northeast Youth</p>

<div class="flex flex-col sm:flex-row gap-4 justify-center">
<button onclick="openModal('join')" class="bg-black text-white px-10 py-4 rounded-full text-xl font-semibold hover:bg-gray-800">Join the Hills</button>
<button onclick="openModal('login')" class="bg-white border-2 border-gray-200 text-black px-10 py-4 rounded-full text-xl font-semibold hover:bg-gray-50">Log In</button>
</div>
</div>

<!-- JOIN MODAL -->
<div id="joinModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
<div class="bg-white rounded-3xl p-8 w-full max-w-md">
<h2 class="text-3xl font-bold mb-2">Join the Hills</h2>
<p class="text-gray-500 mb-6">Create your voice</p>
<input id="jName" placeholder="Full Name" class="w-full border p-3 rounded-xl mb-3">
<input id="jEmail" placeholder="Email" class="w-full border p-3 rounded-xl mb-3">
<input id="jPass" type="password" placeholder="Password" class="w-full border p-3 rounded-xl mb-3">
<select id="jState" class="w-full border p-3 rounded-xl mb-4">
<option>Assam</option><option>Meghalaya</option><option>Manipur</option><option>Nagaland</option><option>Mizoram</option><option>Tripura</option><option>Arunachal Pradesh</option>
</select>
<button onclick="doJoin()" class="w-full bg-black text-white py-3 rounded-xl font-bold">Create Account & Enter</button>
<button onclick="closeModal('join')" class="w-full mt-3 text-gray-500">Cancel</button>
<p id="jMsg" class="text-center mt-3 text-sm"></p>
</div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
<div class="bg-white rounded-3xl p-8 w-full max-w-md">
<h2 class="text-3xl font-bold mb-6">Welcome Back</h2>
<input id="lEmail" placeholder="Email" class="w-full border p-3 rounded-xl mb-3">
<input id="lPass" type="password" placeholder="Password" class="w-full border p-3 rounded-xl mb-4">
<button onclick="doLogin()" class="w-full bg-black text-white py-3 rounded-xl font-bold">Log In</button>
<button onclick="closeModal('login')" class="w-full mt-3 text-gray-500">Cancel</button>
<p id="lMsg" class="text-center mt-3 text-sm"></p>
</div>
</div>

<!-- FEED SCREEN (After Login) -->
<div id="feed" class="hidden w-full max-w-2xl">
<div class="bg-white rounded-3xl p-6 shadow-sm mb-6">
<h2 class="font-bold text-xl">Hello, <span id="uName"></span> 🏔️</h2>
<p class="text-gray-500 text-sm">From <span id="uState"></span></p>
<button onclick="logout()" class="mt-3 text-sm bg-gray-100 px-4 py-2 rounded-full">Log out</button>
</div>

<div class="bg-white rounded-3xl p-6 shadow-sm mb-6">
<textarea id="postText" placeholder="What's happening in the hills today?" class="w-full border-0 text-lg focus:ring-0 resize-none" rows="3"></textarea>
<button onclick="createPost()" class="mt-4 bg-black text-white px-6 py-2 rounded-full font-bold">Post</button>
</div>

<div id="posts" class="space-y-4"></div>
</div>

<script>
// MODAL LOGIC - FIXED
function openModal(type){ document.getElementById(type+'Modal').classList.remove('hidden'); }
function closeModal(type){ document.getElementById(type+'Modal').classList.add('hidden'); }

// SIMPLE STORAGE (Works without Supabase for now)
function doJoin(){
const name=document.getElementById('jName').value;
const email=document.getElementById('lEmail').value || document.getElementById('jEmail').value;
const state=document.getElementById('jState').value;
if(!name ||!document.getElementById('jEmail').value){document.getElementById('jMsg').innerText='Fill all fields'; return;}
localStorage.setItem('ssv_name',name);
localStorage.setItem('ssv_state',state);
localStorage.setItem('ssv_email',document.getElementById('jEmail').value);
showFeed();
}
function doLogin(){
const email=document.getElementById('lEmail').value;
if(!email){document.getElementById('lMsg').innerText='Enter email'; return;}
const savedName=localStorage.getItem('ssv_name')||'Hill Friend';
localStorage.setItem('ssv_email',email);
if(!localStorage.getItem('ssv_name')) localStorage.setItem('ssv_name',email.split('@')[0]);
if(!localStorage.getItem('ssv_state')) localStorage.setItem('ssv_state','Assam');
showFeed();
}
function showFeed(){
document.getElementById('landing').classList.add('hidden');
document.getElementById('joinModal').classList.add('hidden');
document.getElementById('loginModal').classList.add('hidden');
document.getElementById('feed').classList.remove('hidden');
document.getElementById('uName').innerText=localStorage.getItem('ssv_name');
document.getElementById('uState').innerText=localStorage.getItem('ssv_state');
loadPosts();
}
function logout(){ localStorage.clear(); location.reload(); }
function createPost(){
const text=document.getElementById('postText').value;
if(!text.trim()) return;
let posts=JSON.parse(localStorage.getItem('ssv_posts')||'[]');
posts.unshift({name:localStorage.getItem('ssv_name'),state:localStorage.getItem('ssv_state'),text:text,time:new Date().toLocaleString()});
localStorage.setItem('ssv_posts',JSON.stringify(posts));
document.getElementById('postText').value='';
loadPosts();
}
function loadPosts(){
let posts=JSON.parse(localStorage.getItem('ssv_posts')||'[]');
const container=document.getElementById('posts');
if(posts.length==0){container.innerHTML='<div class="text-center text-gray-400 py-10">No posts yet. Be the first voice from the hills!</div>'; return;}
container.innerHTML=posts.map(p=>`<div class="bg-white rounded-3xl p-6 shadow-sm"><div class="flex justify-between"><b>${p.name}</b><span class="text-xs text-gray-400">${p.state} • ${p.time}</span></div><p class="mt-3 text-gray-800">${p.text}</p></div>`).join('');
}
// Auto-login if already joined
if(localStorage.getItem('ssv_email')) showFeed();
</script>
</body>
</html>
