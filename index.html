<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Sisters Voice</title>
<style>
body{font-family:Arial; margin:0; padding:0; background:#fff8f0;}
.header{background:#ff6b35; color:white; padding:15px; text-align:center; font-size:20px; font-weight:bold;}
.tabs{display:flex; overflow-x:auto; background:white; border-bottom:1px solid #ddd; position:sticky; top:0;}
.tabs button{flex:1; padding:12px 15px; border:none; background:white; cursor:pointer; white-space:nowrap;}
.tabs button.active{background:#ff6b35; color:white;}
.tab-content{display:none; padding:15px;}
.tab-content.active{display:block;}
input, textarea, select{width:92%; padding:10px; margin:6px 0; border:1px solid #ccc; border-radius:5px;}
.btn{padding:10px 20px; background:#ff6b35; color:white; border:none; border-radius:5px; cursor:pointer; margin-top:10px;}
</style>
</head>
<body>

<div class="header">Seven Sisters Voice - NE India</div>

<div class="tabs">
  <button class="tabBtn active" onclick="openTab('enter')">Enter Hills</button>
  <button class="tabBtn" onclick="openTab('home')">Home</button>
  <button class="tabBtn" onclick="openTab('jobs')">Jobs</button>
  <button class="tabBtn" onclick="openTab('friends')">Friends</button>
</div>

<!-- ENTER HILLS -->
<div id="enter" class="tab-content active">
  <h2>Welcome to Seven Sisters</h2>
  <p>Voice of Northeast India</p>
  <button class="btn" onclick="openTab('home')">Enter Home</button>
</div>

<!-- HOME -->
<div id="home" class="tab-content">
  <h2>Home Feed</h2>
  <p>Latest posts from hills...</p>
</div>

<!-- JOBS - FIXED -->
<div id="jobs" class="tab-content">
  <h2 style="text-align:center;">Jobs in Northeast</h2>
  <div style="display:flex; gap:10px; justify-content:center; margin:15px;">
    <button id="employerBtn" onclick="switchJob('employer')" style="padding:10px 25px; background:#ff6b35; color:white; border:none; border-radius:20px; font-weight:bold;">Employer</button>
    <button id="employeeBtn" onclick="switchJob('employee')" style="padding:10px 25px; background:#e0e0e0; color:black; border:none; border-radius:20px; font-weight:bold;">Job Seeker</button>
  </div>

  <div id="employerForm">
