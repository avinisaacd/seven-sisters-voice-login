<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Sisters Voice</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,sans-serif}body{background:#fcfcff}.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.grad{background:linear-gradient(90deg,#7c5cff,#ff3b9a,#ff8a00,#00c6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}.btn{padding:14px 28px;border-radius:99px;border:none;font-weight:800;cursor:pointer}.b1{background:#12131a;color:#fff}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}.box{background:#fff;border-radius:24px;padding:28px;width:100%;max-width:410px}.box input,.box textarea{width:100%;padding:12px;border-radius:12px;border:2px solid #eef0f5;margin-top:10px}.btnF{width:100%;padding:14px;background:#12131a;color:#fff;border:none;border-radius:12px;margin-top:14px;font-weight:800;cursor:pointer}#app{display:none;max-width:720px;margin:0 auto;padding:0 16px 80px}.top{position:sticky;top:0;z-index:10;background:rgba(252,252,255,.9);backdrop-filter:blur(14px);display:flex;justify-content:space-between;padding:14px 16px;margin:0 -16px;border-bottom:1px solid #eef0f5}.card{background:#fff;border:1px solid #eef0f5;border-radius:20px;padding:18px;margin:16px 0}.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #7c5cff}.post{background:#fff;border:1px solid #eef0f5;border-radius:20px;overflow:hidden;margin:16px 0}.post img.main,.post video.main{width:100%}.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:#f3f0ff;color:#7c5cff}</style></head><body>
<div id="hero" class="hero"><div><h1 style="font-size:56px;font-weight:900;line-height:.9">Your Voice.<br><span class="grad">Your Hills.</span></h1><p style="color:#6b7280;margin:16px auto">Seven Sisters Voice - Northeast Youth</p><div><button class="btn b1" onclick="document.getElementById('su').style.display='flex'">Join the Hills</button><button class="btn" style="background:#fff;border:2px solid #e5e7eb;margin-left:8px" onclick="document.getElementById('li').style.display='flex'">Log In</button></div></div></div>
